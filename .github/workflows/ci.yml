name: ci
on:
  push:
  pull_request:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --no-deps --all-features
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo test --all-features --lib
  other-platforms:
    # v0.1 has no macOS/Windows backend; this only checks that the crate builds there.
    strategy: { matrix: { os: [macos-latest, windows-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p fstx -p fstx-cli --all-features
  nightly-deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test --release --all-features -- --ignored
      - run: cargo install cargo-fuzz
      - run: cd fuzz && for t in journal progress txpath; do cargo +nightly fuzz run $t -- -max_total_time=120; done
      - name: Install dm-log-writes tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs btrfs-progs "linux-modules-extra-$(uname -r)" || sudo apt-get install -y xfsprogs btrfs-progs
          git clone --depth 1 https://git.kernel.org/pub/scm/fs/xfs/xfstests-dev.git /tmp/xfstests
          sudo gcc -O2 -o /usr/local/bin/replay-log /tmp/xfstests/src/log-writes/log-writes.c /tmp/xfstests/src/log-writes/replay-log.c
      - name: Real-filesystem crash replay (ext4, xfs, btrfs)
        run: |
          cargo build --release --example crash_workload
          sudo env "WORKLOAD=$PWD/target/release/examples/crash_workload" ci/crash-real/run.sh
