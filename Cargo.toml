[package]
name = "fstx"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Atomic, crash-safe multi-file transactions for directory trees"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/neptro/fstx"
homepage = "https://github.com/neptro/fstx"
documentation = "https://docs.rs/fstx"
keywords = ["filesystem", "transaction", "atomic", "crash-safe", "rollback"]
categories = ["filesystem"]
exclude = ["/ci", "/fuzz", "/.github"]

[features]
# Exposes the in-memory crash-simulating filesystem used by the crash tests.
sim = []

[dependencies]
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[profile.test]
opt-level = 2

[[test]]
name = "crash_sim"
required-features = ["sim"]

[[test]]
name = "model"
required-features = ["sim"]

[[test]]
name = "recovery_decisions"
required-features = ["sim"]

[[example]]
name = "crash_demo"
required-features = ["sim"]
